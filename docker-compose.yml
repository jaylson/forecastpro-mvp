services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forecastpro
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./apps/api
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/forecastpro
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/api:/usr/src/app
  web:
    build: ./apps/web
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/usr/src/app
    depends_on:
      - api
volumes:
  db_data:

